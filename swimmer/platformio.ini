[platformio]
default_envs = esp32-c3

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
board_build.flash_mode = dio
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Keep failed TCP dials from blocking the 10 s / 20 s safety watchdog.
    -DWEBSOCKETS_TCP_TIMEOUT=1000
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    links2004/WebSockets@^2.6.1

[env:native]
platform = native
test_build_src = no
