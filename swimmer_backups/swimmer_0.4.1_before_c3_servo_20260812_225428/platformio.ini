[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Keep failed TCP dials from blocking the 10 s / 20 s safety watchdog.
    -DWEBSOCKETS_TCP_TIMEOUT=1000
lib_deps =
    olikraus/U8g2@^2.36.5
    bblanchon/ArduinoJson@^6.21.5
    links2004/WebSockets@^2.6.1

[env:native]
platform = native
test_build_src = no
